<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ほっこり言語アプリ｜キャップ雪だるま</title>
<meta name="description" content="職場やドラマで聞く、やさしい日常会話をゆるっと覚えるアプリたち。">
<meta name="theme-color" content="#ffb8c6">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zirihinit.github.io/hokkori/">
<meta property="og:title" content="ほっこり言語アプリ">
<meta property="og:description" content="職場やドラマで聞く、やさしい日常会話をゆるっと覚えるアプリたち。">
<meta property="og:image" content="https://zirihinit.github.io/hokkori/mamanni/ogp_1.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg:#fff8f1; --card:#fff; --fg:#5a4a4a; --sub:#8f7f7f; --accent:#f59ab0; --soft:#ffe3ea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%; }
  header { padding:20px 20px 24px; text-align:center; }
  header .flower { font-size:34px; }
  header h1 { font-size:clamp(28px,7.5vw,42px); font-weight:800; color:var(--accent); margin:6px 0 10px; letter-spacing:.04em; }
  header p { color:var(--sub); font-size:16px; line-height:1.8; }
  .topnav { max-width:820px; margin:0 auto; padding:14px 18px 0; }
  .home { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:8px 18px 8px 14px;
    border-radius:999px; font-size:15px; font-weight:800; text-decoration:none; border:2px solid; }
  .home:active { transform:scale(.96); }
  .home { color:#c45f78; background:#fff; border-color:var(--accent); }
  main { max-width:820px; margin:0 auto; padding:8px 18px 40px; display:grid; gap:20px; }
  a.card { display:flex; gap:16px; align-items:center; background:var(--card); border-radius:22px;
    padding:16px; color:inherit; text-decoration:none; box-shadow:0 4px 14px rgba(245,154,176,.18);
    transition:transform .12s; }
  a.card:active { transform:scale(.97); }
  @media (hover:hover){ a.card:hover { transform:translateY(-3px); } }
  a.card img { width:104px; height:104px; flex:none; border-radius:20px; object-fit:cover; background:var(--soft); }
  .body h2 { font-size:20px; font-weight:800; margin-bottom:4px; }
  .body .lang { display:inline-block; font-size:13px; background:var(--soft); color:#c45f78;
    padding:2px 10px; border-radius:999px; margin-bottom:6px; }
  .body p { font-size:15px; color:var(--sub); line-height:1.7; }
  .open { display:inline-block; margin-top:8px; background:var(--accent); color:#fff;
    font-weight:800; font-size:15px; padding:6px 18px; border-radius:999px; }
  footer { text-align:center; color:var(--sub); font-size:12px; padding:0 16px 32px; }
</style>
</head>
<body>
<nav class="topnav"><a class="home" href="../">🏠 キャップ雪だるまトップ</a></nav>
<header>
  <div class="flower">🌸</div>
  <h1>ほっこり言語アプリ</h1>
  <p>職場やドラマで聞く、やさしいひとことを<br>ゆるっと覚えるアプリたち</p>
</header>
<main>
  <a class="card" href="./mamanni/">
    <img src="./mamanni/icon-512.png" alt="ママンニ" loading="lazy">
    <div class="body">
      <span class="lang">韓国語</span>
      <h2>ママンニ</h2>
      <p>韓国ドラマで聞こえた言葉を、カタカナや声ですぐ調べられる早引きアプリ。</p>
      <span class="open">ひらく</span>
    </div>
  </a>
  <a class="card" href="./sinhala/">
    <img src="./sinhala/icon-512.png" alt="ほっこりシンハラ語" loading="lazy">
    <div class="body">
      <span class="lang">シンハラ語</span>
      <h2>ほっこりシンハラ語</h2>
      <p>スリランカの仲間と、ひとことから仲良くなろう。</p>
      <span class="open">ひらく</span>
    </div>
  </a>
</main>
<footer>© キャップ雪だるま</footer>
</body>
</html>
