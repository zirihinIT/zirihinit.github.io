<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>教習所からの脱出</title>
<meta name="description" content="ゲーセンで鍛えたからノー勉でもいける！教官なしで教習所コースを走り切って門から脱出しろ。ぶつけたり法律を破るとアウト。">
<meta property="og:title" content="教習所からの脱出">
<meta property="og:description" content="教官なしで教習所コースをクリアしろ。ぶつけたり法律を破るとアウト。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zirihinit.github.io/games/kyoshujo/">

<style>
/* VOICE: 調子に乗った若者と、ツッコミ担当の教官。うるさいくらいの演出
   IDEA: 教習車の運転席と、技能検定の採点表
   PICTURE: 一人称の3Dコースそのもの。ダッシュボード・ハンドル・カーナビが額縁
   COLOUR and TYPE: 案内標識の青 #1f5fbf、止まれの赤 #d7263d、教習車の緑 #19a463 / Dela Gothic One + M PLUS Rounded 1c
   LAYOUT: 全画面3D、左上に課題、右上にカーナビ、下にハンドルとペダル */
:root{--blue:#1f5fbf;--red:#d7263d;--green:#19a463;--ink:#14161a;--wh:min(72vw,44vh,330px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:15px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#task{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:min(54vw,330px);background:rgba(20,22,26,.82);border:2px solid #fff;border-radius:10px;padding:8px 10px}
#task .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800}
#prog{background:var(--green);border-radius:6px;padding:1px 8px;white-space:nowrap}
#timer{color:#ffd54a;font-variant-numeric:tabular-nums;white-space:nowrap}
#next{font-family:"Dela Gothic One",sans-serif;font-size:clamp(14px,3.6vw,19px);line-height:1.25;margin-top:4px}
#lim{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 96px);width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid var(--red);color:var(--blue);font:900 18px/34px "Dela Gothic One",sans-serif;text-align:center}
#navi{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:min(36vw,30vh,200px);aspect-ratio:1;border-radius:12px;border:4px solid #2a2d33;box-shadow:0 0 0 2px #888,0 6px 18px rgba(0,0,0,.5);background:#111}
#naviL{position:absolute;right:calc(max(10px,env(safe-area-inset-right)) + 8px);top:calc(max(10px,env(safe-area-inset-top)) + min(36vw,30vh,200px) - 18px);font-size:11px;font-weight:800;background:#2a2d33;padding:0 8px;border-radius:6px}
#dash{position:absolute;left:0;right:0;bottom:0;height:calc(var(--wh)*.55);background:linear-gradient(#2b2e34,#121317);border-radius:50% 50% 0 0/40px 40px 0 0;box-shadow:0 -4px 0 #3c4048}
#wheel{position:absolute;width:var(--wh);height:var(--wh);left:calc(38% - var(--wh)/2);bottom:calc(var(--wh)*-.3);will-change:transform}
#hubT{position:absolute;left:calc(38% - var(--wh)*.2);width:calc(var(--wh)*.4);bottom:calc(var(--wh)*.08);text-align:center;line-height:1}
#spd{font:400 calc(var(--wh)*.15) "Dela Gothic One",sans-serif;font-variant-numeric:tabular-nums}
#spd.warn{color:#ff4a5a}
#hubT small{display:block;font-size:11px;font-weight:800;opacity:.8}
.wi{position:absolute;bottom:calc(var(--wh)*.16);width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;opacity:.18}
#wiL{left:calc(38% - var(--wh)*.27);border-right:18px solid #35ff7a}
#wiR{left:calc(38% + var(--wh)*.27 - 18px);border-left:18px solid #35ff7a}
.wi.on{opacity:1;filter:drop-shadow(0 0 6px #35ff7a)}
#steer{position:absolute;left:0;bottom:0;width:72%;height:62%;pointer-events:auto}
#tgt{position:absolute;width:var(--wh);height:var(--wh);left:calc(38% - var(--wh)/2);bottom:calc(var(--wh)*-.3);pointer-events:none;opacity:0;transition:opacity .2s}
#tgt.on{opacity:1}#tgt::before{content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);border:9px solid transparent;border-top:14px solid #35ff7a;filter:drop-shadow(0 0 4px #000)}
#pedals{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px;pointer-events:auto}
.pd{border:0;border-radius:10px;color:#fff;font:800 13px "M PLUS Rounded 1c",sans-serif;background:repeating-linear-gradient(180deg,#5d636d 0 6px,#3c4048 6px 10px);box-shadow:0 4px 0 #000,inset 0 0 0 3px #8a919c;touch-action:none}
.pd.on{transform:translateY(4px);box-shadow:0 0 0 #000,inset 0 0 0 3px #fff}
#brk{width:clamp(76px,22vmin,112px);height:clamp(64px,17vmin,92px)}
#acc{width:clamp(54px,14vmin,78px);height:clamp(100px,27vmin,150px);writing-mode:vertical-rl;letter-spacing:.2em}
#wink{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:calc(var(--wh)*.58);display:flex;gap:8px;pointer-events:auto}
#wink button{width:56px;height:50px;line-height:1.1;border-radius:10px;border:2px solid #fff;background:rgba(20,22,26,.8);color:#35ff7a;font:900 20px sans-serif}
#wink button.on{background:#35ff7a;color:#111}#wink small{display:block;font:800 10px "M PLUS Rounded 1c",sans-serif;margin-top:-2px}
#toast{position:absolute;left:0;right:0;top:28%;text-align:center;font:400 clamp(22px,6vw,40px) "Dela Gothic One",sans-serif;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#toast.show{opacity:1;animation:pop .35s}
#toast.good{color:#5dff9a}#toast.bad{color:#ffd54a}
#flash{position:fixed;inset:0;background:#ff1f3a;opacity:0;pointer-events:none}
#bang{position:fixed;left:0;right:0;top:34%;text-align:center;font:400 clamp(44px,15vw,110px) "Dela Gothic One",sans-serif;color:#fff;-webkit-text-stroke:3px var(--red);text-shadow:0 6px 0 var(--red);opacity:0;pointer-events:none}
#bang.show{opacity:1;animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes slam{0%{transform:scale(3) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--wh)*.62);width:min(92vw,520px);background:#fff;color:var(--ink);border-radius:14px;padding:12px 16px 50px;font-weight:800;font-size:16px;box-shadow:0 6px 0 rgba(0,0,0,.35);pointer-events:auto}
#talk::after{content:"タップで次へ ▼";position:absolute;left:16px;bottom:14px;font-size:11px;color:#777}
#skip{position:absolute;right:10px;bottom:8px;border:0;border-radius:8px;background:var(--ink);color:#fff;font:800 12px "M PLUS Rounded 1c",sans-serif;padding:4px 10px;min-height:28px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#title{background:linear-gradient(180deg,rgba(10,30,60,.25),rgba(10,20,40,.85))}
.tbox{width:min(560px,100%);text-align:center}
.sign{background:var(--blue);border:5px solid #fff;outline:3px solid var(--blue);border-radius:14px;padding:18px 16px 14px;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.sign h1{margin:0;font:400 clamp(34px,10vw,58px)/1.05 "Dela Gothic One",sans-serif;text-wrap:balance}
.sign .exit{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--green);border-radius:6px;padding:2px 12px;font:400 18px "Dela Gothic One",sans-serif}
.bub{position:relative;text-wrap:balance;display:inline-block;margin:22px 0 10px;background:#fff;color:var(--ink);border-radius:16px;padding:10px 16px;font-weight:800;font-size:clamp(14px,3.8vw,17px)}
.bub::before{content:"";position:absolute;left:50%;top:-12px;border:8px solid transparent;border-bottom:12px solid #fff;transform:translateX(-50%);border-top:0}
.rules{font-size:14px;opacity:.95;margin:6px 0 14px;text-shadow:0 1px 3px #000}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.b{min-height:48px;padding:0 20px;border-radius:12px;border:0;font:800 16px "M PLUS Rounded 1c",sans-serif;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.b.main{background:#ffd54a;font:400 22px "Dela Gothic One",sans-serif;min-height:58px;padding:0 34px}
.b.x{background:#111;color:#fff}
.b.sub{background:rgba(255,255,255,.16);color:#fff}
.b:focus-visible{outline:3px solid #35ff7a;outline-offset:2px}
.keys{font-size:12px;opacity:.75;margin-top:14px}
#res{background:rgba(0,0,0,.6)}
.sheet{position:relative;width:min(460px,100%);background:#fbfaf6;color:var(--ink);border-radius:6px;padding:18px 18px 16px;box-shadow:0 12px 30px rgba(0,0,0,.5);background-image:repeating-linear-gradient(#fbfaf6 0 31px,#e3e8ef 31px 32px)}
.sheet h3{margin:0 0 6px;font-size:13px;color:#667;border-bottom:2px solid var(--ink);padding-bottom:4px}
.sheet h2{margin:8px 0 0;font:400 clamp(26px,7vw,36px)/1.1 "Dela Gothic One",sans-serif;color:var(--red)}
.sheet h2.ok{color:var(--green)}
.law{font-weight:800;margin:4px 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
.tbl td{padding:4px 0;border-bottom:1px solid #ccd}
.tbl td:first-child{white-space:nowrap;padding-right:12px}.tbl td:last-child{text-align:right;font-weight:800}
.kyo{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;margin-bottom:12px}
.kyo b{color:var(--blue)}
.stamp{position:absolute;right:-8px;top:-18px;width:96px;height:96px;background:rgba(251,250,246,.6);border-radius:50%;border:5px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font:400 22px/1.05 "Dela Gothic One",sans-serif;transform:rotate(-14deg);opacity:.88;animation:stp .4s cubic-bezier(.2,1.6,.4,1)}
.stamp.ok{border-color:var(--green);color:var(--green)}
@keyframes stp{0%{transform:scale(2.6) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:.88}}
.new{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:0 8px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:middle}
.sheet .btns .b{flex:1 1 130px}
.sheet .b.sub{background:#e8ebf0;color:var(--ink)}
#zk{background:rgba(8,12,20,.94);align-items:flex-start}
.zwrap{width:min(720px,100%);padding-top:max(10px,env(safe-area-inset-top))}
.zwrap h2{font:400 26px "Dela Gothic One",sans-serif;margin:6px 0 2px}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 16px}
.zc{background:#fff;color:var(--ink);border-radius:10px;padding:10px;min-height:96px;border-left:6px solid var(--red)}
.zc b{display:block;font:400 17px "Dela Gothic One",sans-serif}
.zc small{display:block;font-size:12px;color:#555;line-height:1.4}
.zc.lock{background:#2a2e36;color:#8890a0;border-left-color:#555}
.zc .n{float:right;font-size:11px;color:#999}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div id="task"><div class="row"><span id="prog">課題 0/15</span><span id="timer">教官が戻るまで 7:00</span></div><div id="next">—</div></div>
  <div id="lim">40</div>
  <canvas id="navi"></canvas><div id="naviL">NAVI</div>

  <svg id="wheel" viewBox="-100 -100 200 200" aria-hidden="true">
    <circle r="88" fill="none" stroke="#17181b" stroke-width="20"/>
    <circle r="88" fill="none" stroke="#3a3d44" stroke-width="4" stroke-dasharray="4 7"/>
    <path d="M-80 4 Q-40 -6 -24 6 L24 6 Q40 -6 80 4 L80 20 Q40 12 26 30 L12 82 L-12 82 L-26 30 Q-40 12 -80 20Z" fill="#202227"/>
    <circle r="30" fill="#2a2d33" stroke="#444" stroke-width="3"/>

  <div id="wiL" class="wi"></div><div id="wiR" class="wi"></div>

</div>
<div id="flash"></div>

<div id="title" class="ov">

<div id="res" class="ov hide">

      <a class="b sub" href="https://zirihinit.github.io/" target="_blank" rel="noopener">他のゲームをあそぶ</a>

<div id="zk" class="ov hide">
  <div class="zwrap">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.getElementById(s);
const TAU=Math.PI*2,W=256,H=128,TS=6,MS=4;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrap=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const GAME_URL='https://zirihinit.github.io/games/kyoshujo/';
const TIME_LIMIT=420;

/* ===== コース定義（x:東 z:南、単位m） ===== */
function rrect(x0,z0,x1,z1,r){const p=[];const arc=(cx,cz,a0)=>{for(let i=0;i<=8;i++){const a=a0+i/8*Math.PI/2;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}};
  arc(x1-r,z0+r,-Math.PI/2);arc(x1-r,z1-r,0);arc(x0+r,z1-r,Math.PI/2);arc(x0+r,z0+r,Math.PI);return p}
const SP=[[90,-45],[80,-45]];for(let i=1;i<=48;i++){const t=i/48;SP.push([80-70*t,-45-16*Math.sin(TAU*t)*Math.sin(Math.PI*t)])}SP.push([0,-45]);
const ROADS=[
  {p:rrect(-90,-90,90,90,14),w:7,c:1,two:1},
  {p:[[0,-90],[0,90]],w:7,two:1},
  {p:[[-90,0],[90,0]],w:7,two:1},
  {p:[[-45,90],[-45,132]],w:6},
  {p:[[45,90],[45,68],[65,68],[65,45],[45,45],[45,0]],w:6,m:1},
  {p:SP,w:6}];
const NODES=[[0,-90,7,{W:3.5,E:3.5,S:3.5}],[0,-45,6,{N:3.5,S:3.5,E:3}],[0,0,7,{N:3.5,S:3.5,E:3.5,W:3.5}],[0,90,7,{N:3.5,E:3.5,W:3.5}],[-45,90,6,{E:3.5,W:3.5,S:3}],[45,90,6,{E:3.5,W:3.5,N:3}],[45,0,6,{E:3.5,W:3.5,S:3}],[90,0,7,{N:3.5,S:3.5,W:3.5}],[90,-45,6,{N:3.5,S:3.5,W:3}],[-90,0,7,{N:3.5,S:3.5,E:3.5}],[-45,140,6,{N:3,E:3.5,W:3.5}],[260,140,7,{N:3.5,S:3.5,E:3.5,W:3.5}]];
function fillets(c,col,line){for(const [x,z,r,A] of NODES)for(const v of ['N','S'])for(const h of ['E','W']){if(!A[v]||!A[h])continue;const sx=h==='E'?1:-1,sz=v==='S'?1:-1,rf=(A[v]<3.5||A[h]<3.5)?4:5;
 const cx=x+sx*A[v],cz=z+sz*A[h],ox=cx+sx*rf,oz=cz+sz*rf,a1=Math.atan2(cz-oz,cx+sx*rf-ox),a2=Math.atan2(cz+sz*rf-oz,cx-ox),ccw=wrap(a2-a1)<0;
 c.fillStyle=col;c.beginPath();c.moveTo(cx-sx*.2,cz-sz*.2);c.lineTo(cx+sx*rf,cz-sz*.2);c.lineTo(cx+sx*rf,cz);c.arc(ox,oz,rf,a1,a2,ccw);c.lineTo(cx-sx*.2,cz+sz*rf);c.closePath();c.fill();
 if(line){c.strokeStyle=line;c.lineWidth=.16;c.beginPath();c.arc(ox,oz,rf+.1,a1,a2,ccw);c.stroke()}}}
const LANES=[[-90,-76,-90,76],[-76,-90,76,-90],[90,-76,90,76],[-76,90,76,90],[0,-90,0,90],[-90,0,90,0],[-30,140,620,140],[260,60,260,220]];

 if(wink){blT+=dt;const on=(blT%.76)<.38;if(on!==blOn){blOn=on;SE.tick(on)}}else{blOn=false;blT=0}}
function camUpdate(dt){
 if(st==='title'){const a=t*.07;cam.position.set(Math.cos(a)*150,62,Math.sin(a)*150);cam.lookAt(0,0,0);hood.visible=false;return}

 if(fly){fly.t+=dt;ey+=fly.t*fly.t*7+fly.t*4;ex+=fly.vx*fly.t;cam.position.set(ex,ey,ez);cam.lookAt(ex+c*20,ey-4-fly.t*6,ez+s*20);cam.rotateZ(fly.t*7);return}
 if(shake>0){ex+=(Math.random()-.5)*shake;ey+=(Math.random()-.5)*shake;ez+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*1.4)}
 cam.position.set(ex,ey,ez);cam.lookAt(ex+c*20,.95,ez+s*20);cam.rotateZ(-car.steer*car.v*.0025)}

 const ph=sig('NS');nx.fillStyle=ph==='g'?'#19e6b0':ph==='y'?'#ffc400':'#ff2d2d';nx.beginPath();nx.arc(0,0,4,0,TAU);nx.fill();
 const hx=trainHead(pt);if(hx>-128&&hx<-24){nx.fillStyle='#ff7a1a';nx.fillRect(Math.max(-128,hx-36),-32,Math.min(hx,-62)-Math.max(-128,hx-36),4)}

 if(wp<WPS.length){const [x,z]=WPS[wp],r=6+Math.sin(t*6)*2;nx.strokeStyle='#ff2d55';nx.lineWidth=2.4;nx.beginPath();nx.arc(x,z,r,0,TAU);nx.stroke();nx.setLineDash([4,4]);nx.lineWidth=1.2;nx.beginPath();nx.moveTo(car.x,car.z);nx.lineTo(x,z);nx.stroke();nx.setLineDash([])}
 nx.save();nx.translate(car.x,car.z);nx.rotate(car.th);nx.fillStyle='#ffd54a';nx.strokeStyle='#000';nx.lineWidth=1;nx.beginPath();nx.moveTo(7,0);nx.lineTo(-5,-5);nx.lineTo(-2.5,0);nx.lineTo(-5,5);nx.closePath();nx.fill();nx.stroke();nx.restore()}
function drawNavi2(){const S=nv.width,k=S/170;nx.setTransform(1,0,0,1,0,0);nx.fillStyle='#4f8a3f';nx.fillRect(0,0,S,S);nx.setTransform(k,0,0,k,S/2-car.x*k,S/2-car.z*k);
 nx.fillStyle='#6f9a5a';nx.fillRect(-110,-110,220,220);nx.fillStyle='#55585e';nx.fillRect(-60,136.5,685,7);nx.fillRect(256.5,55,7,170);nx.fillRect(-48,100,6,40);
 nx.fillStyle='#d7263d';nx.fillRect(509,119,12,10);nx.fillStyle='#fff';nx.font='bold 7px sans-serif';nx.fillText('自宅',506,116);
 const e=sig2('EW');nx.fillStyle=e==='g'?'#19e6b0':e==='y'?'#ffc400':'#ff2d2d';nx.beginPath();nx.arc(260,140,3.2,0,TAU);nx.fill();
 for(const o of cars){const [ox,oz]=cpos(o),L=LN[o.ln];nx.fillStyle=o.ln==='EB'?'#fff':o.ln==='WB'?'#9fd3f2':'#ffb36b';L.ax==='x'?nx.fillRect(ox-2.1,oz-.9,4.2,1.8):nx.fillRect(ox-.9,oz-2.1,1.8,4.2)}
 if(wp<WPS.length){const [x,z]=WPS[wp];nx.strokeStyle='#ff2d55';nx.lineWidth=1.6;nx.beginPath();nx.arc(x,z,5+Math.sin(t*6)*1.5,0,TAU);nx.stroke()}
 nx.save();nx.translate(car.x,car.z);nx.rotate(car.th);nx.fillStyle='#ffd54a';nx.strokeStyle='#000';nx.lineWidth=.6;nx.beginPath();nx.moveTo(5,0);nx.lineTo(-3.5,-3.5);nx.lineTo(-2,0);nx.lineTo(-3.5,3.5);nx.closePath();nx.fill();nx.stroke();nx.restore()}
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const fmt2=s=>Math.floor(s/60)+'分'+(s%60).toFixed(1)+'秒';

 $('wheel').style.transform=`rotate(${car.steer*420}deg)`;$('wiL').className='wi'+(wink===-1&&blOn?' on':'');$('wiR').className='wi'+(wink===1&&blOn?' on':'');
 $('wl').className=wink===-1?'on':'';$('wr').className=wink===1?'on':'';$('acc').className='pd'+(I.acc?' on':'');{const tg=touchS!==null?touchS:(I.l||K.l?-1:0)+(I.r||K.r?1:0);const e=$('tgt');e.className=Math.abs(tg-car.steer)>.03?'on':'';e.style.transform=`rotate(${tg*420}deg)`}$('brk').className='pd'+(I.brk?' on':'');
 if(stage===1){$('prog').textContent=`課題 ${Math.min(wp,15)}/15`;$('next').textContent=wp<15?WPS[wp][2]:'門を出ろ！！';$('timer').textContent='教官が戻るまで '+fmt(TIME_LIMIT-pt);drawNavi()}
 else{$('prog').textContent='EXTRA';$('next').textContent=wp<WPS.length?WPS[wp][2]:'自宅の前でブレーキ停車！';$('timer').textContent='公道 '+fmt(Math.max(0,pt-pt2));drawNavi2()}}

/* ===== 画面遷移 ===== */
const TALK=['教官「ちょっとトイレ行ってくるから。車で待っててね」','（……教官が行ってしまった）','自分「ゲーセンで散々鍛えたし、ノー勉でもいけるべ！」','課題を回って、出口の門から脱出しろ！'];
function talk(lines,cb){talkL=lines;talkCb=cb;talkI=0;$('talk').classList.remove('hide');$('talkT').textContent=lines[0]}
function startGame(){au();reset();setTimeout(rs,0);st='intro';$('title').classList.add('hide');$('res').classList.add('hide');$('hud').classList.remove('hide');$('bang').className='';SE.pop();talk(TALK,()=>{st='play';SE.fan();toast('検定スタート！','good')})}
function nextTalk(){if(!talkCb)return;talkI++;SE.pop();if(talkI>=talkL.length){$('talk').classList.add('hide');const f=talkCb;talkCb=null;f()}else $('talkT').textContent=talkL[talkI]}
function skipTalk(){if(!talkCb)return;talkI=talkL.length-1;nextTalk()}
$('skip').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();skipTalk()});
$('talk').addEventListener('pointerdown',e=>{e.preventDefault();nextTalk()});
function zkCount(){return Object.keys(OUTS).filter(k=>ZK[k]).length}
function showRes(){const clear=st==='clear',ex=stage===2;$('res').classList.remove('hide');$('bang').className='';SE.stamp();
 const st2=$('rStamp');st2.className='stamp'+(clear?' ok':'');st2.innerHTML=clear?'帰宅<br>成功':ex?'公道で<br>アウト':'検定<br>中止';
 const n=Object.keys(OUTS).length;let text;
 if(clear){$('rTitle').textContent='帰宅成功！！';$('rTitle').className='ok';$('rLaw').textContent='教習所を脱出し、無免許のまま家の前に停めた';
  $('rKyo').innerHTML='<b>教官</b>「……おかえり。先回りしといたよ。それ教習車だから返してね。あと、無免許運転ね」';
  text=`【教習所からの脱出】教習所を脱出→公道も走り切って帰宅成功!! タイム ${fmt2(pt)}\nアウト図鑑 ${zkCount()}/${n}\n#教習所からの脱出`}
 else{const o=OUTS[outId];$('rTitle').innerHTML='';$('rTitle').className='';$('rTitle').textContent=o.t;if(out.isNew){const sp=document.createElement('span');sp.className='new';sp.textContent='図鑑NEW';$('rTitle').appendChild(sp)}
  $('rLaw').textContent=o.law;$('rKyo').innerHTML='<b>教官</b>「'+o.k+'」';
  const at=wp<WPS.length?WPS[wp][2].split(' ')[0]:'門の前';
  text=ex?`【教習所からの脱出】教習所は脱出！…と思ったら公道で${o.t}アウト\n教官「${o.k}」\n#教習所からの脱出`:`【教習所からの脱出】「${at}」で${o.t}アウト…（課題 ${Math.min(wp,15)}/15）\n教官「${o.k}」\n#教習所からの脱出`}
 $('rProg').textContent=ex?(clear?'15 / 15 + EXTRAクリア':'15 / 15 + EXTRAでアウト'):`${Math.min(wp,15)} / 15`;$('rTime').textContent=fmt2(pt);$('rZk').textContent=`${zkCount()} / ${n}`;$('rBest').textContent=[ZK.best?`脱出 ${fmt2(ZK.best)}`:'',ZK.bestEx?`帰宅 ${fmt2(ZK.bestEx)}`:''].filter(Boolean).join(' ／ ')||'—';
 $('shareB').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(GAME_URL)}
function showZK(){const n=Object.keys(OUTS).length;$('zkN').textContent=`${zkCount()} / ${n}`;$('zkClear').textContent=(ZK.clear?`脱出成功 ${ZK.clear}回　最速 ${fmt2(ZK.best)}`:'まだ脱出できていない……')+(ZK.extra?`／帰宅成功 ${ZK.extra}回　最速 ${fmt2(ZK.bestEx)}`:'');
 $('zkG').innerHTML=Object.keys(OUTS).map((k,i)=>{const o=OUTS[k];return ZK[k]?`<div class="zc"><span class="n">No.${i+1}　${ZK[k]}回</span><b>${o.t}</b><small>${o.law}</small><small>「${o.k}」</small></div>`:`<div class="zc lock"><span class="n">No.${i+1}</span><b>？？？</b><small>まだやらかしていない</small></div>`}).join('');$('zk').classList.remove('hide')}

function hold(id,key){const e=$(id);const on=v=>ev=>{ev.preventDefault();I[key]=v;if(v){au();try{e.setPointerCapture(ev.pointerId)}catch(_){}}};e.addEventListener('pointerdown',on(true));for(const n of ['pointerup','pointercancel','lostpointercapture'])e.addEventListener(n,on(false))}
hold('acc','acc');hold('brk','brk');

$('wl').addEventListener('pointerdown',e=>{e.preventDefault();setW(-1)});$('wr').addEventListener('pointerdown',e=>{e.preventDefault();setW(1)});
{const z=$('steer');let sx=0,s0r=0,pid=null;
 z.addEventListener('pointerdown',e=>{e.preventDefault();au();pid=e.pointerId;sx=e.clientX;s0r=touchR!==null?touchR:Math.sign(car.steer)*Math.abs(car.steer)**(1/1.7);touchR=s0r;touchS=Math.sign(s0r)*Math.abs(s0r)**1.7;try{z.setPointerCapture(pid)}catch(_){}});
 z.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;{const r=clamp(s0r+(e.clientX-sx)/(z.clientWidth*.6),-1,1);touchR=r;touchS=Math.sign(r)*Math.abs(r)**1.7}});
 for(const n of ['pointerup','pointercancel','lostpointercapture'])z.addEventListener(n,e=>{if(e.pointerId===pid){pid=null;touchS=null;touchR=null}})}

addEventListener('keydown',e=>{const k=KM[e.key]||KM[e.key.toLowerCase()];if(k){K[k]=true;e.preventDefault();au()}const q=e.key.toLowerCase();if(st==='play'&&(q==='q'||q==='z'))setW(-1);if(st==='play'&&(q==='e'||q==='c'))setW(1);if((st==='intro'||st==='intro2')&&(e.key==='Enter'||e.key===' '))nextTalk();if((st==='intro'||st==='intro2')&&e.key==='Escape')skipTalk()});
addEventListener('keyup',e=>{const k=KM[e.key]||KM[e.key.toLowerCase()];if(k)K[k]=false});
