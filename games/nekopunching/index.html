*{box-sizing:border-box}

.btn{min-height:56px;min-width:180px;padding:10px 28px;border-radius:28px;border:0;background:#fff;color:#333;font:800 20px 'M PLUS Rounded 1c',sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

.more{min-height:44px;display:inline-flex;align-items:center;padding:8px 20px;border-radius:22px;border:2px solid rgba(255,255,255,.85);color:#fff;font-weight:800;font-size:14px;text-decoration:none;background:rgba(0,0,0,.2)}

<script>
{

const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2a1e30);
const camera=new THREE.PerspectiveCamera(60,1,0.02,3000);

addEventListener('resize',resize);resize();

const dl=new THREE.DirectionalLight(0xfff4e0,.6);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:.05,far:60});scene.add(dl);scene.add(dl.target);
const stars=(()=>{const n=2500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=rnd(-1,1),t=rnd(0,6.283),s=Math.sqrt(1-u*u),d=rnd(2000,3000);p[i*3]=s*Math.cos(t)*d;p[i*3+1]=u*d;p[i*3+2]=s*Math.sin(t)*d;}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false}));m.visible=false;scene.add(m);return m;})();

const W=new THREE.Group();scene.add(W);

const ND={mug:1.3,remote:1.2,fish:2.4,tuna:2.4,yarn:1.6,pot:1,trash:1,bike:1.8,vend:1.3,car:1.9,tree:2,house:2.6,bus:3.6,bldg:2.5,tower:3.2,pyramid:5.5,mount:8.8,volcano:2,city:2,island:2,continent:2,ken:2,desert:2,post:.6,deer:.9,maneki:.7,moai:.5,leaning:.45,goddess:.6};
