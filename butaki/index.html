<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic",sans-serif;display:flex;justify-content:center}
  #wrap{position:relative;width:100%;max-width:480px;height:100%}
  canvas{display:block;width:100%;height:100%}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;pointer-events:none}
  .ov.on{pointer-events:auto}
  .hidden{display:none}
  #title h1{margin:0 0 6px;font-size:clamp(26px,8.5vw,40px);line-height:1.15;color:#fff;text-shadow:0 3px 0 #c2456a,0 0 12px rgba(0,0,0,.35);letter-spacing:.02em}
  #title h1 small{display:block;font-size:.55em;color:#ffe066;text-shadow:0 2px 0 #9a6a00}
  .card{background:rgba(255,255,255,.92);color:#5a3a2a;border-radius:16px;padding:14px 18px;margin:10px 18px;font-size:14px;line-height:1.7;box-shadow:0 6px 0 rgba(0,0,0,.18)}
  .card b{color:#c2456a}
  .blink{margin-top:14px;font-size:18px;font-weight:bold;animation:bl 1s infinite;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  @keyframes bl{50%{opacity:.25}}
  #result .big{font-size:56px;font-weight:bold;color:#ffe066;text-shadow:0 4px 0 #9a6a00;line-height:1}
  #result .why{white-space:pre-line;font-size:20px;font-weight:bold;margin-bottom:8px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  #result .rank{font-size:18px;margin:8px 0 2px}
  #result .best{font-size:14px;opacity:.9}
  #result .new{color:#ff8fab;font-weight:bold}
  .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
  .btn{font:inherit;font-weight:bold;font-size:17px;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .pink{background:#ff7aa2;color:#fff}
  .black{background:#111;color:#fff}
  #resultBox{background:rgba(40,20,30,.82);border-radius:20px;padding:22px 20px;margin:0 16px}
</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="title" class="ov">
    <h1>ブタもおだてりゃ<br>木に登る<small>〜 どこまで登れるブー？ 〜</small></h1>
    <div class="card">
      <b>← →</b>（スマホは<b>画面の左右タップ</b>）で<br>その側に回りこんで1m登る！<br>
      木こりがいる側に登ると<b>トンカツ</b>確定。<br>
      登るたびに褒められて<b>おだてゲージ</b>が回復。<br>
      おだてが切れるとやる気を失って落ちる。
    </div>
    <div class="blink">← → で スタート</div>
  </div>

  <div id="result" class="ov hidden">
    <div id="resultBox">
      <div class="why" id="rWhy"></div>
      <div class="big" id="rScore">0m</div>
      <div class="rank" id="rRank"></div>
      <div class="best" id="rBest"></div>
      <div class="btns">
        <button class="btn pink" id="retry">もう一回登る</button>
        <a class="btn black" id="share" href="#" target="_blank" rel="noopener">𝕏 でシェア</a>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const titleEl = document.getElementById('title');
const resultEl = document.getElementById('result');

let W = 0, H = 0, DPR = 1, SH = 80, TW = 72, PR = 34, baseY = 0;
function resize(){
  const r = wrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  SH = Math.min(H * 0.11, 88);
  TW = SH * 0.85;
  PR = SH * 0.40;
  baseY = H * 0.80;
}
window.addEventListener('resize', resize);
resize();

// ---------- storage ----------
let best = 0;
try { best = parseInt(localStorage.getItem('butaBest') || '0', 10) || 0; } catch(e){}
function saveBest(){ try { localStorage.setItem('butaBest', String(best)); } catch(e){} }

// ---------- sound ----------
let ac = null;
function audio(){
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ac && ac.state === 'suspended') ac.resume().catch(()=>{});
}
function beep(freq, dur, type='square', vol=0.08, slide=0){
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch(e){}
}

// ---------- game state ----------
const L = -1, R = 1;
let mode = 'title';
let segs = [];         // segs[i] = 0 | L | R  (woodcutter side)
let idx = 0, side = L, camY = 0, gauge = 0.6, t = 0;
let climbAnim = 0, shake = 0, flash = 0, lockUntil = 0;
let popups = [], particles = [];
let dead = null, deathReason = '', hitSeg = -1;

const PRAISE = ['いいぞ！','天才ブタ！','かわいい〜！','その調子！','木登りの申し子！','ブタの鑑！','世界一！','うまい！','もう一声！','惚れ直した！','才能しかない！','ナイス豚足！','優勝！','ブヒ界の宝！','輝いてる！'];
const MILE = {50:'電柱こえた！',100:'雲の上だブー！',150:'東京タワー級！',200:'飛行機より上！',300:'宇宙到達！？',400:'月が近い！',500:'ブタ、神になる',777:'フィーバー！！',1000:'伝説のブタ'};

function genSegs(upTo){
  while (segs.length <= upTo){
    const i = segs.length;
    if (i < 6) { segs.push(0); continue; }
    const p = Math.min(0.78, 0.42 + i * 0.0015);
    const prev = segs[i-1];
    let v = 0;
    if (Math.random() < p) {
      // tend to alternate a little to make rhythm
      v = (prev && Math.random() < 0.55) ? -prev : (Math.random() < 0.5 ? L : R);
    }
    segs.push(v);
  }
}

function reset(){
  segs = []; genSegs(40);
  idx = 0; side = L; camY = 0; gauge = 0.6;
  popups = []; particles = []; dead = null; hitSeg = -1; climbAnim = 0;
}
reset();

function start(){
  mode = 'play';
  reset();
  titleEl.classList.add('hidden');
  resultEl.classList.add('hidden'); resultEl.classList.remove('on');
}

function drainRate(){ return 0.13 + Math.min(0.30, idx * 0.0011); }

function move(s){
  audio();
  if (performance.now() < lockUntil) return;
  if (mode === 'title') { start(); }
  if (mode === 'result') { start(); return; }
  if (mode !== 'play') return;
  side = s;
  idx++;
  genSegs(idx + 30);
  climbAnim = 1;
  gauge = Math.min(1, gauge + 0.062);
  if (segs[idx] === s) { die('chop'); return; }
  beep(520 + Math.min(idx, 400), 0.05, 'square', 0.05);
  // praise
  if (MILE[idx]) {
    addPopup(MILE[idx], 34, '#ffe066'); gauge = Math.min(1, gauge + 0.25);
    beep(784,0.12,'triangle',0.08); setTimeout(()=>beep(1047,0.18,'triangle',0.08),110);
    burst(W/2, baseY - SH*0.5, 24, ['#ffe066','#ff7aa2','#fff']);
  } else if (idx % 10 === 0) {
    addPopup(PRAISE[(Math.random()*PRAISE.length)|0], 24, '#fff');
    gauge = Math.min(1, gauge + 0.12);
    beep(880,0.08,'triangle',0.07);
    burst(pigX(), baseY - SH*0.5, 10, ['#ffe066','#ff7aa2']);
  } else if (Math.random() < 0.12) {
    addPopup(PRAISE[(Math.random()*PRAISE.length)|0], 15, '#fff', true);
  }
}

function die(reason){
  mode = 'dying'; deathReason = reason;
  const sx = pigX(), sy = baseY - SH*0.5 - (camY - idx*SH);
  if (reason === 'chop') {
    hitSeg = idx;
    dead = {x:sx, y:sy, vx: side*-1*0 + side*260, vy:-420, rot:0, vr: side*9};
    shake = 14; flash = 1;
    addPopup('ブヒィィ！！', 30, '#ff4d4d');
    beep(200,0.35,'sawtooth',0.12,-150);
    burst(sx, sy, 30, ['#ffb6c1','#fff','#ff4d4d']);
  } else {
    dead = {x:sx, y:sy, vx:0, vy:-120, rot:0, vr: side*1.5};
    addPopup('もう褒めてくれないの…', 20, '#cde');
    beep(400,0.6,'triangle',0.1,-320);
  }
  if (idx > best) {}
  setTimeout(showResult, 1300);
}

function rankOf(m){
  if (m < 10) return '子ブタ（おだて不足）';
  if (m < 30) return 'ふつうのブタ';
  if (m < 60) return 'ちょっと登れるブタ';
  if (m < 100) return '木登りブタ';
  if (m < 150) return '雲上のブタ';
  if (m < 200) return 'スカイツリー豚';
  if (m < 300) return '空飛ぶブタ';
  if (m < 500) return '宇宙ブタ';
  return 'ブタ神';
}

function showResult(){
  mode = 'result';
  const score = deathReason === 'chop' ? idx - 1 : idx;
  const isNew = score > best;
  if (isNew) { best = score; saveBest(); }
  document.getElementById('rWhy').textContent = deathReason === 'chop' ? '木こりに切られた！\nトンカツ確定！' : 'おだてが切れて落ちた…';
  document.getElementById('rScore').textContent = score + 'm';
  document.getElementById('rRank').textContent = '称号：' + rankOf(score);
  document.getElementById('rBest').innerHTML = isNew && score > 0 ? '<span class="new">★ 自己ベスト更新！ ★</span>' : '自己ベスト：' + best + 'm';
  const txt = `ブタをおだてて ${score}m 登らせた！【称号：${rankOf(score)}】\n#ブタもおだてりゃ木に登る #クソゲー`;
  document.getElementById('share').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(txt) + '&url=' + encodeURIComponent('https://zirihinit.github.io/butaki/');
  resultEl.classList.remove('hidden'); resultEl.classList.add('on');
  lockUntil = performance.now() + 500;
}
document.getElementById('retry').addEventListener('click', e => { e.stopPropagation(); audio(); start(); });

// ---------- input ----------
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); move(L); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); move(R); }
  else if ((e.key === ' ' || e.key === 'Enter') && mode === 'result') { e.preventDefault(); start(); }
});
function onPointer(e){
  if (mode === 'result') return;
  e.preventDefault();
  const r = wrap.getBoundingClientRect();
  move((e.clientX - r.left) < r.width/2 ? L : R);
}
cv.addEventListener('pointerdown', onPointer);
titleEl.addEventListener('pointerdown', onPointer);

// ---------- effects ----------
function addPopup(text, size, color, small){
  const x = small ? pigX() + side * -PR*0.2 : W/2;
  popups.push({text, size, color, x, y: baseY - SH*1.6 - (small?0:SH*0.6), life: 1.3, max: 1.3});
}
function burst(x,y,n,cols){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 80 + Math.random()*260;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,life:0.8+Math.random()*0.5,c:cols[i%cols.length],r:2+Math.random()*4});
  }
}

// ---------- geometry ----------
function pigX(){ return W/2 + side * (TW/2 + PR*0.72); }
function sy(wy){ return baseY - (wy - camY); }   // world y -> screen y
function hash(n){ const x = Math.sin(n*127.1+311.7)*43758.5453; return x - Math.floor(x); }

// ---------- drawing ----------
function lerpCol(a,b,k){
  const pa = a.match(/\w\w/g).map(h=>parseInt(h,16)), pb = b.match(/\w\w/g).map(h=>parseInt(h,16));
  return 'rgb(' + pa.map((v,i)=>Math.round(v+(pb[i]-v)*k)).join(',') + ')';
}
function skyAt(m){
  const stops = [[0,'8fd8ff','e8f8ff'],[120,'4f9be8','a8dcff'],[220,'2a3f9a','5b7fd1'],[320,'0d1033','27306b'],[600,'000008','0b0b25']];
  for (let i=0;i<stops.length-1;i++){
    const [a,ta,ba] = stops[i], [b,tb,bb] = stops[i+1];
    if (m <= b){ const k = Math.max(0,(m-a)/(b-a)); return [lerpCol(ta,tb,k), lerpCol(ba,bb,k)]; }
  }
  return ['rgb(0,0,8)','rgb(11,11,37)'];
}

function drawBG(){
  const m = camY / SH;
  const [top,bot] = skyAt(m);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // stars
  const sa = Math.min(1, Math.max(0,(m-180)/120));
  if (sa > 0){
    ctx.fillStyle = `rgba(255,255,255,${sa})`;
    for (let i=0;i<70;i++){
      const x = hash(i)*W, y = ((hash(i+99)*H*2 + camY*0.08) % (H*1.2)) - H*0.1;
      const r = 0.6 + hash(i+7)*1.6;
      ctx.globalAlpha = sa * (0.5 + 0.5*Math.sin(t*2+i));
      ctx.fillRect(x,y,r,r);
    }
    ctx.globalAlpha = 1;
  }
  // moon
  if (m > 330){
    const ma = Math.min(1,(m-330)/60);
    ctx.globalAlpha = ma; ctx.fillStyle = '#fff6c8';
    ctx.beginPath(); ctx.arc(W*0.78, H*0.2, SH*0.7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(200,190,140,.6)';
    ctx.beginPath(); ctx.arc(W*0.75, H*0.18, SH*0.13, 0, Math.PI*2); ctx.arc(W*0.82, H*0.23, SH*0.1, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // clouds (parallax)
  const ca = Math.max(0, 1 - Math.max(0,(m-200))/80);
  if (ca > 0){
    ctx.fillStyle = `rgba(255,255,255,${0.85*ca})`;
    const span = SH*7;
    const start = Math.floor((camY*0.5 - H) / span);
    for (let k = start; k < start + 6; k++){
      if (k < 0) continue;
      const wy = k*span + hash(k)*span;
      const y = baseY - (wy - camY*0.5) - SH*3;
      const x = ((hash(k+3)*1.4 - 0.2) * W + t*12*(hash(k+5)>.5?1:-1)) % (W+200) ;
      cloud(x < -150 ? x + W + 200 : x, y, SH*(0.6+hash(k+8)*0.6));
    }
  }
  // airplane kusoge
  if (m > 170 && m < 260){
    const px = ((t*90) % (W+300)) - 150, py = sy(205*SH) ;
    if (py > -50 && py < H+50) plane(px, py);
  }
}
function cloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,s,0,Math.PI*2); ctx.arc(x+s*1.1,y+s*0.15,s*0.8,0,Math.PI*2);
  ctx.arc(x-s*1.0,y+s*0.2,s*0.7,0,Math.PI*2); ctx.arc(x+s*0.3,y-s*0.5,s*0.75,0,Math.PI*2);
  ctx.fill();
}
function plane(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#eee'; ctx.strokeStyle='#888'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,46,10,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-22,24); ctx.lineTo(-8,24); ctx.lineTo(12,0); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-36,-2); ctx.lineTo(-48,-20); ctx.lineTo(-40,-20); ctx.lineTo(-28,-4); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#5aa9e6'; for(let i=0;i<5;i++){ctx.fillRect(-20+i*10,-4,5,4);}
  ctx.restore();
}

function drawGround(){
  const gy = sy(0);
  if (gy > H + 10) return;
  ctx.fillStyle = '#6cc04a'; ctx.fillRect(0, gy, W, H - gy + 10);
  ctx.fillStyle = '#58a83a';
  for (let i=0;i<14;i++){ const x = hash(i+50)*W; ctx.beginPath(); ctx.ellipse(x, gy+12+hash(i)*30, 18, 5, 0, 0, Math.PI*2); ctx.fill(); }
  // roots
  ctx.fillStyle = '#8a5a34';
  ctx.beginPath(); ctx.moveTo(W/2-TW/2, gy-4); ctx.quadraticCurveTo(W/2-TW, gy+4, W/2-TW*1.1, gy+8); ctx.lineTo(W/2+TW*1.1, gy+8); ctx.quadraticCurveTo(W/2+TW, gy+4, W/2+TW/2, gy-4); ctx.fill();
  // boss lumberjack
  const bx = W/2 + TW*1.55, by = gy + 4;
  ctx.save(); ctx.translate(bx, by); ctx.scale(-1.3,1.3);
  drawCutter(0, 0, t*5, false);
  ctx.restore();
  // speech
  if (mode === 'title' || idx < 6){
    bubble(bx - SH*0.2, by - SH*2.3, mode==='title' ? 'トンカツにしてやる〜' : '降りてこ〜い！');
  }
}
function bubble(x,y,text){
  ctx.font = `bold ${Math.round(SH*0.2)}px sans-serif`;
  const w = ctx.measureText(text).width + 18, h = SH*0.38;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
  const bx = Math.min(W - w - 6, x - w/2);
  roundRect(bx, y - h, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-6, y); ctx.lineTo(x+4, y+10); ctx.lineTo(x+8, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + w/2, y - h/2);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function visibleRange(){
  const lo = Math.max(0, Math.floor((camY + baseY - H) / SH) - 1);
  const hi = Math.ceil((camY + baseY) / SH) + 1;
  return [lo, hi];
}

function drawTrunk(){
  const [lo,hi] = visibleRange();
  const x0 = W/2 - TW/2;
  for (let i=lo;i<=hi;i++){
    const yb = sy(i*SH), yt = sy((i+1)*SH);
    ctx.fillStyle = i%2 ? '#9a6638' : '#a26d3e';
    ctx.fillRect(x0, yt, TW, yb-yt+1);
    // bark
    ctx.strokeStyle = 'rgba(70,40,20,.45)'; ctx.lineWidth = 2;
    for (let k=0;k<3;k++){
      const bx = x0 + TW*(0.2 + 0.3*k) + (hash(i*3+k)-0.5)*TW*0.15;
      ctx.beginPath(); ctx.moveTo(bx, yt + SH*0.15); ctx.quadraticCurveTo(bx + 4, (yt+yb)/2, bx - 2, yb - SH*0.15); ctx.stroke();
    }
    if (hash(i*7) > 0.85){ // knot
      ctx.fillStyle = 'rgba(60,35,15,.5)';
      ctx.beginPath(); ctx.ellipse(x0+TW*hash(i+1)*0.6+TW*0.2, (yt+yb)/2, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    }
    // height sign
    if (i > 0 && i % 50 === 0){
      ctx.fillStyle = '#fff3c4'; ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2;
      roundRect(W/2 - TW*0.38, yb - SH*0.7, TW*0.76, SH*0.4, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#6b4423'; ctx.font = `bold ${Math.round(SH*0.22)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(i+'m', W/2, yb - SH*0.5);
    }
  }
  // edges shading
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(x0, 0, 5, H); ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x0+TW-6, 0, 6, H);
  // canopy top hidden (infinite tree) — leaves sprinkled
  for (let i=lo;i<=hi;i++){
    if (segs[i]) continue;
    if (hash(i*13) > 0.78){
      const s = hash(i*5) > 0.5 ? 1 : -1;
      const y = sy(i*SH + SH*0.7);
      const x = W/2 + s*(TW/2);
      ctx.strokeStyle = '#7a4f2a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s*SH*0.35, y - SH*0.15); ctx.stroke();
      ctx.fillStyle = '#4caf50';
      ctx.beginPath(); ctx.ellipse(x + s*SH*0.38, y - SH*0.2, SH*0.14, SH*0.08, s*-0.5, 0, Math.PI*2); ctx.fill();
    }
  }
}

function drawCutters(){
  const [lo,hi] = visibleRange();
  for (let i=Math.max(lo,1);i<=hi;i++){
    const s = segs[i]; if (!s) continue;
    const edge = W/2 + s*TW/2;
    const by = sy(i*SH + SH*0.02);
    // branch
    ctx.fillStyle = '#7a4f2a';
    ctx.beginPath();
    ctx.moveTo(edge, by - 7); ctx.lineTo(edge + s*SH*2.2, by - 3); ctx.lineTo(edge + s*SH*2.2, by + 3); ctx.lineTo(edge, by + 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.ellipse(edge + s*SH*2.25, by - 4, SH*0.25, SH*0.14, 0, 0, Math.PI*2); ctx.fill();
    // woodcutter standing on branch, facing trunk
    const cx = edge + s*SH*1.05;
    ctx.save(); ctx.translate(cx, by - 3); ctx.scale(-s, 1);
    const hit = (i === hitSeg);
    const phase = hit ? 0.2 : t*7 + i*1.7;
    drawCutter(0, 0, phase, hit);
    ctx.restore();
    // danger hint
    if (i === idx + 1 && mode === 'play'){
      ctx.fillStyle = 'rgba(255,60,60,' + (0.18 + 0.12*Math.sin(t*12)) + ')';
      ctx.beginPath(); ctx.arc(edge + s*PR*0.72, sy(i*SH + SH*0.5), PR*0.9, 0, Math.PI*2); ctx.fill();
    }
  }
}

// woodcutter facing right, origin at feet. phase: number (anim) ; hit: freeze swing down
function drawCutter(x, y, phase, hit){
  const u = SH/80;
  ctx.save(); ctx.translate(x, y); ctx.scale(u, u);
  // legs
  ctx.fillStyle = '#2d4f8a';
  ctx.fillRect(-9, -26, 7, 26); ctx.fillRect(2, -26, 7, 26);
  ctx.fillStyle = '#3b2716'; ctx.fillRect(-11,-4,10,5); ctx.fillRect(1,-4,12,5);
  // body (plaid)
  ctx.fillStyle = '#c62f2f'; roundRect(-12, -56, 24, 32, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(30,0,0,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); for (let k=-8;k<=8;k+=8){ ctx.moveTo(k,-56); ctx.lineTo(k,-24); } for (let k=-48;k<=-28;k+=10){ ctx.moveTo(-12,k); ctx.lineTo(12,k);} ctx.stroke();
  // head
  ctx.fillStyle = '#f2c79a'; ctx.beginPath(); ctx.arc(2, -68, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#6b3d1e'; ctx.beginPath(); ctx.ellipse(4, -61, 10, 7, 0, 0, Math.PI); ctx.fill(); // beard
  ctx.fillStyle = '#222'; ctx.fillRect(6,-71,3,3); // eye
  ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(3,-75); ctx.lineTo(10,-73); ctx.stroke(); // angry brow
  ctx.fillStyle = '#1f6f3a'; ctx.beginPath(); ctx.arc(1, -74, 11, Math.PI, 0); ctx.fill(); ctx.fillRect(-11,-75,24,4); // beanie
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(1,-86,3.5,0,Math.PI*2); ctx.fill();
  // arm + axe (swing)
  const k = hit ? 1 : (Math.sin(phase) + 1) / 2; // 0 raised .. 1 down
  const ang = -2.3 + k * 2.2;
  ctx.save(); ctx.translate(4, -50); ctx.rotate(ang);
  ctx.fillStyle = '#c62f2f'; ctx.fillRect(0,-4,16,8);
  ctx.fillStyle = '#f2c79a'; ctx.beginPath(); ctx.arc(17,0,4.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(12,-3,40,6); // handle
  ctx.fillStyle = '#b8c2cc'; ctx.strokeStyle = '#59636d'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(42,-3); ctx.lineTo(56,-18); ctx.quadraticCurveTo(64,-2,58,14); ctx.lineTo(42,3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

// pig facing right (toward trunk when on left side). origin center.
function drawPig(x, y, s, rot, faceMood){
  const r = PR;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(-s, 1); // side L(-1) => scale 1 => faces right
  ctx.lineWidth = 2; ctx.strokeStyle = '#d06a85';
  // tail
  ctx.beginPath(); ctx.moveTo(-r*0.85, r*0.1);
  ctx.bezierCurveTo(-r*1.25, -r*0.1, -r*1.2, r*0.45, -r*1.0, r*0.3); ctx.stroke();
  // back legs (hugging)
  ctx.fillStyle = '#ffa3b8';
  ctx.beginPath(); ctx.ellipse(r*0.55, r*0.62, r*0.32, r*0.17, -0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // body
  ctx.fillStyle = '#ffb9c9';
  ctx.beginPath(); ctx.ellipse(0, r*0.15, r*0.9, r*0.72, -0.15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(r*0.45, -r*0.45, r*0.55, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // ears
  ctx.fillStyle = '#ff9fb5';
  ctx.beginPath(); ctx.moveTo(r*0.05,-r*0.8); ctx.lineTo(r*0.0,-r*1.2); ctx.lineTo(r*0.35,-r*0.95); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.55,-r*0.98); ctx.lineTo(r*0.7,-r*1.35); ctx.lineTo(r*0.85,-r*0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
  // snout
  ctx.fillStyle = '#ff9fb5';
  ctx.beginPath(); ctx.ellipse(r*0.95, -r*0.35, r*0.2, r*0.25, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#a8455f';
  ctx.beginPath(); ctx.ellipse(r*0.97,-r*0.43,r*0.04,r*0.07,0,0,Math.PI*2); ctx.ellipse(r*0.97,-r*0.27,r*0.04,r*0.07,0,0,Math.PI*2); ctx.fill();
  // eye
  ctx.strokeStyle = '#333'; ctx.fillStyle = '#333'; ctx.lineWidth = 2.2;
  if (faceMood === 'dead'){
    ctx.beginPath(); ctx.moveTo(r*0.5,-r*0.66); ctx.lineTo(r*0.68,-r*0.48); ctx.moveTo(r*0.68,-r*0.66); ctx.lineTo(r*0.5,-r*0.48); ctx.stroke();
  } else if (faceMood === 'happy'){
    ctx.beginPath(); ctx.arc(r*0.6,-r*0.52,r*0.1,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(r*0.6,-r*0.55,r*0.07,0,Math.PI*2); ctx.fill();
  }
  // blush
  ctx.fillStyle = faceMood === 'happy' ? 'rgba(255,80,120,.55)' : 'rgba(255,120,150,.35)';
  ctx.beginPath(); ctx.ellipse(r*0.55,-r*0.28,r*0.12,r*0.07,0,0,Math.PI*2); ctx.fill();
  // sweat
  if (faceMood === 'sad'){
    ctx.fillStyle = '#7ec8ff';
    ctx.beginPath(); ctx.moveTo(r*0.2,-r*0.95); ctx.quadraticCurveTo(r*0.1,-r*0.7,r*0.2,-r*0.68); ctx.quadraticCurveTo(r*0.3,-r*0.7,r*0.2,-r*0.95); ctx.fill();
  }
  // front legs hugging trunk
  ctx.fillStyle = '#ffa3b8'; ctx.strokeStyle = '#d06a85'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(r*0.85, r*0.0, r*0.3, r*0.15, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawPigNow(){
  if (mode === 'dying' || mode === 'result'){
    if (dead) drawPig(dead.x, dead.y, side, dead.rot, 'dead');
    return;
  }
  const bob = Math.sin(climbAnim*Math.PI) * -SH*0.12;
  const y = sy(idx*SH + SH*0.5) + bob;
  const mood = gauge > 0.7 ? 'happy' : gauge < 0.25 ? 'sad' : 'normal';
  drawPig(pigX(), y, side, 0, mood);
}

function drawHUD(){
  if (mode === 'title') return;
  // score
  const score = mode === 'play' ? idx : (deathReason==='chop'? idx-1 : idx);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `bold ${Math.round(SH*0.62)}px sans-serif`;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.strokeText(Math.max(0,score) + 'm', W/2, 54);
  ctx.fillStyle = '#fff'; ctx.fillText(Math.max(0,score) + 'm', W/2, 54);
  ctx.font = `bold ${Math.round(SH*0.18)}px sans-serif`; ctx.lineWidth = 4;
  ctx.strokeText('BEST ' + best + 'm', W/2, 54 + SH*0.7); ctx.fillText('BEST ' + best + 'm', W/2, 54 + SH*0.7);
  // gauge
  const gw = Math.min(W*0.8, 340), gx = (W-gw)/2, gy = 18, gh = 20;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(gx-3, gy-3, gw+6, gh+6, 13); ctx.fill();
  const v = Math.max(0, gauge);
  const col = v > 0.5 ? '#ff7aa2' : v > 0.25 ? '#ffb347' : (Math.sin(t*20)>0 ? '#ff4d4d':'#aa2222');
  ctx.fillStyle = col; if (v > 0.01){ roundRect(gx, gy, gw*v, gh, 10); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.font = `bold 12px sans-serif`; ctx.textBaseline = 'middle';
  ctx.fillText('おだてゲージ', W/2, gy + gh/2);
  // touch hints
  if (mode === 'play' && idx < 8){
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(SH*0.5)}px sans-serif`;
    ctx.fillText('◀', W*0.12, H*0.92); ctx.fillText('▶', W*0.88, H*0.92); ctx.globalAlpha = 1;
  }
}

function drawFX(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups){
    const k = p.life / p.max;
    const sc = k > 0.85 ? 1 + (k-0.85)*3 : 1;
    ctx.globalAlpha = Math.min(1, k*2);
    ctx.font = `bold ${Math.round(p.size*sc)}px sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(80,20,40,.8)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash*0.7})`; ctx.fillRect(0,0,W,H); }
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; t += dt;

  const target = idx * SH;
  camY += (target - camY) * Math.min(1, dt * 14);
  climbAnim = Math.max(0, climbAnim - dt*7);
  shake = Math.max(0, shake - dt*40);
  flash = Math.max(0, flash - dt*3);

  if (mode === 'play'){
    gauge -= drainRate() * dt;
    if (gauge <= 0){ gauge = 0; die('gauge'); }
  }
  if (dead && (mode === 'dying' || mode === 'result')){
    dead.vy += 1200*dt; dead.x += dead.vx*dt; dead.y += dead.vy*dt; dead.rot += dead.vr*dt;
  }
  for (const p of particles){ p.vy += 600*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups){ p.y -= 40*dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBG();
  drawTrunk();
  drawGround();
  drawCutters();
  drawPigNow();
  drawFX();
  ctx.restore();
  drawHUD();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
