<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zirihinIT</title>
<meta name="description" content="スマホですぐ遊べるゲームと、ゆるっと覚える言語アプリ。インストール不要。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zirihinit.github.io/">
<meta property="og:title" content="zirihinIT">
<meta property="og:description" content="スマホですぐ遊べるゲームと、ゆるっと覚える言語アプリ。インストール不要。">
<meta name="twitter:card" content="summary">
<style>
  :root { --bg:#f6f4f1; --fg:#333; --sub:#777; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%; }
  header { padding:48px 20px 28px; text-align:center; }
  header h1 { font-size:clamp(30px,8vw,44px); font-weight:800; letter-spacing:.04em; }
  header p { color:var(--sub); font-size:15px; margin-top:8px; }
  main { max-width:820px; margin:0 auto; padding:0 18px 40px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
  a.door { display:block; border-radius:24px; padding:30px 24px 26px; text-decoration:none;
    text-align:center; transition:transform .12s; box-shadow:0 6px 18px rgba(0,0,0,.08); }
  a.door:active { transform:scale(.97); }
  @media (hover:hover){ a.door:hover { transform:translateY(-4px); } }
  .door .icon { font-size:48px; }
  .door h2 { font-size:24px; font-weight:800; margin:10px 0 8px; }
  .door p { font-size:15px; line-height:1.7; }
  .door .go { display:inline-block; margin-top:16px; font-weight:800; font-size:15px;
    padding:8px 22px; border-radius:999px; }
  .games { background:#16161d; color:#fff; border-top:8px solid #ffd400; }
  .games h2 { color:#ffd400; }
  .games p { color:#b8b8c8; }
  .games .go { background:#ffd400; color:#16161d; }
  .hokkori { background:#fff8f1; color:#5a4a4a; border-top:8px solid #f59ab0;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif; }
  .hokkori h2 { color:#f59ab0; }
  .hokkori p { color:#8f7f7f; }
  .hokkori .go { background:#f59ab0; color:#fff; }
  footer { text-align:center; color:var(--sub); font-size:12px; padding:0 16px 32px; }
</style>
</head>
<body>
<header>
  <h1>zirihinIT</h1>
  <p>スマホですぐ使える、ちいさなアプリ置き場</p>
</header>
<main>
  <a class="door games" href="./games/">
    <div class="icon">🎮</div>
    <h2>ゲームはこちら</h2>
    <p>タップしたらすぐ遊べる、<br>単発クソゲーの置き場です。</p>
    <span class="go">▶ 遊びにいく</span>
  </a>
  <a class="door hokkori" href="./hokkori/">
    <div class="icon">🌸</div>
    <h2>ほっこり言語はこちら</h2>
    <p>職場やドラマで聞くひとことを、<br>ゆるっと覚える言語アプリ。</p>
    <span class="go">ひらく</span>
  </a>
</main>
<footer>© zirihinIT</footer>
</body>
</html>
