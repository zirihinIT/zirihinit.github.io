<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャップ雪だるま｜スマホで遊べる単発ゲーム置き場</title>
<meta name="description" content="スマホのブラウザですぐ遊べる単発ゲームの置き場。インストール不要、タップするだけ。">
<link rel="canonical" href="https://zirihinit.github.io/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zirihinit.github.io/">
<meta property="og:title" content="キャップ雪だるま｜スマホで遊べる単発ゲーム置き場">
<meta property="og:description" content="スマホのブラウザですぐ遊べる単発ゲームの置き場。インストール不要、タップするだけ。">
<meta property="og:image" content="https://zirihinit.github.io/games/skypark/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffd400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1b22; --paper:#fff7dc; --card:#fff; --sub:#6b6474;
    --yellow:#ffd400; --red:#ff4d4d; --blue:#3d8bff; --pink:#ff7eb3; --green:#2fc28a; --purple:#9b6bff;
    --line:3px solid var(--ink); --shadow:5px 5px 0 var(--ink); --r:16px;
    --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  .logo,.hello h1,.label,.hero h2,.new,.play{font-weight:900;font-synthesis:none}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background-image:radial-gradient(rgba(29,27,34,.09) 1.3px,transparent 1.4px);
    background-size:18px 18px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:auto}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}

  /* ---------- ヘッダー ---------- */
  .top{background:var(--yellow);border-bottom:var(--line)}
  .top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
  .logo{font-family:var(--display);font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .logo .mark{width:34px;height:34px;border:var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px}
  .top .count{margin-left:auto;font-size:13px;font-weight:800;background:#fff;border:var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}

  .hello{padding:30px 0 6px;text-align:center}
  .hello h1{font-family:var(--display);font-size:clamp(28px,7.6vw,52px);line-height:1.25;letter-spacing:.02em}
  .hello h1 .hl{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .1em}
  .hello p{margin-top:10px;color:var(--sub);font-size:14px;font-weight:700}

  /* ---------- 見出し ---------- */
  .label{display:inline-block;font-family:var(--display);font-size:15px;background:var(--ink);color:#fff;
    padding:5px 14px 6px;border-radius:999px;margin:28px 0 12px;letter-spacing:.04em}

  /* ---------- 最新作 ---------- */
  .hero{display:grid;grid-template-columns:1.35fr 1fr;background:var(--card);border:var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,box-shadow .12s}
  .hero .pic{position:relative;border-right:var(--line);background:#000}
  .hero .pic img{height:100%;object-fit:cover;aspect-ratio:1200/630}
  .hero .info{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px}
  .hero h2{font-family:var(--display);font-size:clamp(24px,4vw,34px);line-height:1.2}
  .hero .catch{font-weight:900;font-size:17px;color:var(--red)}
  .hero .desc{font-size:14.5px;line-height:1.75;color:#3c3844}
  .hero .play{margin-top:auto;align-self:flex-start;font-size:18px;padding:12px 28px}
  .new{position:absolute;top:12px;right:12px;font-family:var(--display);font-size:14px;background:var(--red);color:#fff;
    border:var(--line);border-radius:8px;padding:3px 10px 4px;transform:rotate(6deg);box-shadow:3px 3px 0 var(--ink)}

  /* ---------- 絞り込み ---------- */
  .listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 12px}
  .listhead .label{margin:0}
  .tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
  .chip{font:inherit;font-size:14px;font-weight:800;color:var(--ink);background:#fff;border:var(--line);border-radius:999px;
    padding:7px 14px;min-height:40px;cursor:pointer;transition:transform .08s}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff}
  .chip:active{transform:scale(.95)}
  .gacha{background:var(--pink);flex-shrink:0}
  .chip.g-play{background:#dcebff}.chip.g-style{background:#ece2ff}.chip.g-mode{background:#ffe08a}.chip.g-theme{background:#d6f5e6}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* ---------- 一覧 ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{display:flex;flex-direction:column;background:var(--card);border:var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,box-shadow .12s}
  .card .pic{border-bottom:var(--line);background:#000;position:relative}
  .card .pic img{aspect-ratio:1200/630;object-fit:cover}
  .card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h3{font-size:17px;font-weight:900;line-height:1.35}
  .card .catch{font-size:13.5px;font-weight:800;color:var(--red)}
  .card .desc{font-size:13.5px;line-height:1.65;color:#4a4552}
  .card .foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  @media (hover:hover){
    .card:hover,.hero:hover{transform:translate(-2px,-3px) rotate(-.4deg);box-shadow:8px 9px 0 var(--ink)}
  }
  .card:active,.hero:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}

  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11.5px;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;background:#fff}
  .tag.g-play{background:#dcebff}.tag.g-style{background:#ece2ff}.tag.g-mode{background:#ffe08a}.tag.g-theme{background:#d6f5e6}
  .play{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:14px;background:var(--yellow);
    border:var(--line);border-radius:999px;padding:5px 14px 6px;white-space:nowrap}
  .card[hidden]{display:none}

  /* ---------- ガチャ ---------- */
  .gm{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:rgba(29,27,34,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s}
  .gm[hidden]{display:none}
  @keyframes fade{from{opacity:0}}
  .gm-box{position:relative;width:min(440px,100%);background:var(--paper);border:var(--line);border-radius:20px;
    box-shadow:8px 8px 0 var(--ink);padding:18px 18px 20px;text-align:center;animation:boxin .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes boxin{from{transform:scale(.6) rotate(-4deg);opacity:0}}
  .gm-x{position:absolute;top:-14px;right:-14px;width:42px;height:42px;border-radius:50%;border:var(--line);
    background:#fff;font-size:22px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
  .gm-head{font-family:var(--display);font-weight:900;font-size:22px;margin-bottom:12px}
  .gm-head.spin{animation:shake .12s infinite}
  @keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
  .gm-pic{position:relative;border:var(--line);border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1200/630}
  .gm-pic img{height:100%;object-fit:cover}
  .gm-pic.spin img{filter:blur(1.5px) saturate(1.4)}
  .gm-pic.hit{animation:hit .5s cubic-bezier(.2,1.8,.4,1)}
  @keyframes hit{0%{transform:scale(.85)}60%{transform:scale(1.06)}}
  .gm-res{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:140px}
  .gm-res[data-on="0"]{visibility:hidden}
  .gm-res h3{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.25}
  .gm-res .catch{font-weight:900;color:var(--red);font-size:15px}
  .gm-btns{display:flex;gap:10px;margin-top:8px;width:100%}
  .gm-btns>*{flex:1;justify-content:center;font-size:16px;padding:10px 12px;min-height:48px;cursor:pointer;color:var(--ink)}
  .gm-again{font:inherit;font-weight:900;background:#fff;border:var(--line);border-radius:999px}
  .confetti{position:absolute;left:50%;top:38%;width:10px;height:14px;border:2px solid var(--ink);border-radius:2px;
    pointer-events:none;animation:pop 1s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

  /* ---------- フッター ---------- */
  footer{text-align:center;color:var(--sub);font-size:12px;padding:48px 16px 40px}

  /* ---------- スマホ ---------- */
  @media (max-width:860px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:700px){
    .hero{grid-template-columns:1fr}
    .hero .pic{border-right:0;border-bottom:var(--line)}
    .hero .info{padding:16px 16px 18px}
    .hero .play{align-self:stretch;justify-content:center}
  }
  @media (max-width:560px){
    .grid{gap:14px}
    :root{--shadow:4px 4px 0 var(--ink);--r:13px}
    .card .body{padding:9px 10px 11px;gap:5px}
    .card h3{font-size:14.5px}
    .card .catch{font-size:12px}
    .card .desc{display:none}
    .card .foot{flex-direction:column;align-items:stretch}
    .card .play{justify-content:center;font-size:13px}
    .tag{font-size:10.5px;padding:0 5px}
    .tools{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
    .tools::-webkit-scrollbar{display:none}
    .chip{flex-shrink:0}
    .hello p{word-break:keep-all}
        .tools{gap:6px}
    .chip{font-size:13px;padding:6px 11px;min-height:38px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="./"><span class="mark">⛄</span>キャップ雪だるま</a>
    <span class="count" id="count"></span>
  </div>
</header>

<main class="wrap">
  <section class="hello">
    <h1>タップして<span class="hl">すぐ遊べる</span><br>単発ゲーム置き場</h1>
    <p>インストール不要。スマホのブラウザで<wbr>そのまま遊べます</p>
  </section>

  <span class="label">🔥 最新作</span>
  <a class="hero" id="hero"></a>

  <div class="listhead">
    <span class="label">🎮 ぜんぶのゲーム</span>
    <button class="chip gacha" id="gacha">🎲 迷ったらガチャ</button>
  </div>
  <div class="tools" id="tools"></div>
  <div class="grid" id="grid"></div>

</main>

<footer>© キャップ雪だるま</footer>

<script>
/* =========================================================
   ゲームを追加するときは、この配列のいちばん上に1つ足すだけ。
   先頭のゲームが「最新作」として大きく表示されます。
   tags: 下の TAG_GROUPS にあるタグから選ぶ（新しいタグは TAG_GROUPS にも足す）
   hidden: true をつけると一覧に出さない（公開前のゲーム用）
   ========================================================= */
const GAMES = [
  {
    title: "猫パンチんぐ",
    url: "./games/nekopunching/", img: "./games/nekopunching/ogp.png",
    catch: "部屋から、世界まで。",
    desc: "三毛猫が目の前の物をパンチして大きくなる。部屋→家→町→県→日本→アジア→全世界、クリアまでのタイムを競う。",
    tags: ["アクション"],
  },
  {
    title: "空飛ぶ車の駐車場",
    url: "./games/skypark/", img: "./games/skypark/ogp.png",
    catch: "かっこよく停めろ！",
    hidden: true, // ← まだ公開しない（消すと一覧に出る）
    desc: "ジェットを噴かして空飛ぶ車を駐車。横風・鳥・雷・ドローン・UFOが邪魔してくる全8ステージ。",
    tags: ["アクション"],
  },
  {
    title: "角刈り一丁ッ！",
    url: "./games/kakugari/", img: "./games/kakugari/ogp.png",
    catch: "90度ジャストに刈り上げろ！",
    desc: "指でスライドして刈り、退店時は角刈りの型抜き。はみ出したら転び、スカスカなら店長がボコられる。",
    tags: ["日常あるある"],
  },
  {
    title: "激落！！消しゴムバトル！！",
    url: "./gekiochi/", img: "./gekiochi/ogp.png",
    catch: "弾いて机から叩き落とせ！",
    desc: "消しゴムを指で弾く3D対戦。CPU戦・友達とネット対戦・ランクマッチ。",
    tags: ["アクション", "対戦", "日常あるある"],
  },
  {
    title: "本日のマナー講座ザマス",
    url: "./games/zamasu/", img: "./games/zamasu/ogp.png",
    catch: "怒られずに食べきれるか!?",
    desc: "マナー講師の目を盗んで完食せよ。和洋中 全12編。ムカついたらちゃぶ台返し💥",
    tags: ["日常あるある"],
  },
  {
    title: "ブタもおだてりゃ木に登る",
    url: "./games/butaki/", img: "./games/butaki/ogp.png",
    catch: "どこまで登れるブー？",
    desc: "木こりをよけて、おだてられながらブタが木を登り続ける。←→かタップで操作。",
    tags: ["アクション", "エンドレス"],
  },
  {
    title: "かもしれない運転",
    url: "./games/kamoshirenai/", img: "./games/kamoshirenai/ogp.png",
    catch: "「かもしれない」をよけ続けろ",
    desc: "迫りくる「かもしれない」をよけて、何m生き残れるか。最高320km/h。",
    tags: ["アクション", "エンドレス"],
  },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* タグの種類（この順番で絞り込みボタンが並ぶ。色は種類ごと） */
const TAG_GROUPS = {
  play:  ["アクション"],
  style: ["エンドレス"],
  mode:  ["対戦"],
  theme: ["日常あるある"],
};
const groupOf = t => Object.keys(TAG_GROUPS).find(k => TAG_GROUPS[k].includes(t)) || "play";
const ORDER = Object.values(TAG_GROUPS).flat();
const tagsHTML = g => `<div class="tags">${g.tags.map(t => `<span class="tag g-${groupOf(t)}">${esc(t)}</span>`).join("")}</div>`;
const LIST = GAMES.filter(g => !g.hidden);   // 公開中のゲームだけ

// 最新作
const h = LIST[0], hero = document.getElementById("hero");
hero.href = h.url;
hero.innerHTML = `
  <div class="pic"><img src="${esc(h.img)}" alt="${esc(h.title)}" fetchpriority="high"><span class="new">NEW!</span></div>
  <div class="info">
    ${tagsHTML(h)}
    <h2>${esc(h.title)}</h2>
    <div class="catch">${esc(h.catch)}</div>
    <p class="desc">${esc(h.desc)}</p>
    <span class="play">▶ 今すぐ遊ぶ</span>
  </div>`;

document.getElementById("count").textContent = `全${LIST.length}本`;

// 一覧
const grid = document.getElementById("grid");
grid.innerHTML = LIST.map((g, i) => `
  <a class="card" href="${esc(g.url)}" data-tags="${esc(g.tags.join(","))}" data-i="${i}">
    <div class="pic"><img src="${esc(g.img)}" alt="${esc(g.title)}" loading="lazy"></div>
    <div class="body">
      ${tagsHTML(g)}
      <h3>${esc(g.title)}</h3>
      <div class="catch">${esc(g.catch)}</div>
      <p class="desc">${esc(g.desc)}</p>
      <div class="foot"><span class="play">▶ 遊ぶ</span></div>
    </div>
  </a>`).join("");

// 絞り込み（タグはゲームから自動で集める）
const allTags = [...new Set(LIST.flatMap(g => g.tags))]
  .sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
const tools = document.getElementById("tools");
tools.innerHTML = ["すべて", ...allTags].map((t, i) =>
  `<button class="chip${i ? " g-" + groupOf(t) : ""}" data-tag="${esc(t)}" aria-pressed="${i === 0}">${esc(t)}</button>`).join("");
document.getElementById("gacha").onclick = () => openGacha();

let curTag = "すべて";
tools.addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  curTag = b.dataset.tag;
  tools.querySelectorAll(".chip[data-tag]").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  grid.querySelectorAll(".card").forEach(c => {
    c.hidden = !(curTag === "すべて" || c.dataset.tags.split(",").includes(curTag));
  });
});

/* ---------- ガチャ（絞り込み中ならその中から） ---------- */
document.body.insertAdjacentHTML("beforeend", `
  <div class="gm" id="gm" hidden role="dialog" aria-modal="true" aria-label="ガチャ">
    <div class="gm-box">
      <button class="gm-x" id="gmX" aria-label="とじる">×</button>
      <div class="gm-head" id="gmHead">🎲 ガチャ中…</div>
      <div class="gm-pic" id="gmPic"><img id="gmImg" alt=""></div>
      <div class="gm-res" id="gmRes" data-on="0"></div>
    </div>
  </div>`);
const gm = document.getElementById("gm"), gmHead = document.getElementById("gmHead"),
      gmPic = document.getElementById("gmPic"), gmImg = document.getElementById("gmImg"),
      gmRes = document.getElementById("gmRes");
let rolling = 0;

function pool() {
  return LIST.filter(g => curTag === "すべて" || g.tags.includes(curTag));
}
function openGacha() {
  gm.hidden = false;
  document.body.style.overflow = "hidden";
  roll();
}
function closeGacha() {
  rolling++;
  gm.hidden = true;
  document.body.style.overflow = "";
}
function roll() {
  const games = pool();
  if (!games.length) return;
  games.forEach(g => { new Image().src = g.img; });   // 先読み
  const id = ++rolling;
  const pick = games[Math.floor(Math.random() * games.length)];
  gmRes.dataset.on = "0";
  gmHead.textContent = "🎲 ガチャ中…";
  gmHead.classList.add("spin");
  gmPic.classList.remove("hit");
  gmPic.classList.add("spin");
  let k = Math.floor(Math.random() * games.length), delay = 55, t = 0;
  const step = () => {
    if (id !== rolling) return;
    if (t > 1600 || games.length === 1) return land(pick);
    k = (k + 1) % games.length;
    gmImg.src = games[k].img;
    t += delay; delay *= 1.13;
    setTimeout(step, delay);
  };
  step();
}
function land(g) {
  gmImg.src = g.img; gmImg.alt = g.title;
  gmHead.classList.remove("spin");
  gmHead.textContent = "🎉 これに決定！";
  gmPic.classList.remove("spin");
  void gmPic.offsetWidth; gmPic.classList.add("hit");
  gmRes.innerHTML = `
    ${tagsHTML(g)}
    <h3>${esc(g.title)}</h3>
    <div class="catch">${esc(g.catch)}</div>
    <div class="gm-btns">
      <button class="gm-again" id="gmAgain">🎲 もう一回</button>
      <a class="play" href="${esc(g.url)}">▶ 遊ぶ</a>
    </div>`;
  gmRes.dataset.on = "1";
  document.getElementById("gmAgain").onclick = roll;
  confetti();
}
function confetti() {
  const box = gm.querySelector(".gm-box");
  const colors = ["#ffd400", "#ff4d4d", "#3d8bff", "#ff7eb3", "#2fc28a", "#9b6bff"];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 160;
    c.style.cssText = `background:${colors[i % colors.length]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d - 60}px;--r:${Math.random() * 720 - 360}deg`;
    box.appendChild(c);
    setTimeout(() => c.remove(), 1100);
  }
}
document.getElementById("gmX").onclick = closeGacha;
gm.addEventListener("click", e => { if (e.target === gm) closeGacha(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !gm.hidden) closeGacha(); });
</script>
</body>
</html>
