<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャップ雪だるま｜スマホで遊べる単発ゲーム置き場</title>
<meta name="description" content="スマホのブラウザですぐ遊べる単発ゲームの置き場。インストール不要、タップするだけ。">
<link rel="canonical" href="https://zirihinit.github.io/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zirihinit.github.io/">
<meta property="og:title" content="キャップ雪だるま｜スマホで遊べる単発ゲーム置き場">
<meta property="og:description" content="スマホのブラウザですぐ遊べる単発ゲームの置き場。インストール不要、タップするだけ。">
<meta property="og:image" content="https://zirihinit.github.io/games/skypark/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffd400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1b22; --paper:#fff7dc; --card:#fff; --sub:#6b6474;
    --yellow:#ffd400; --red:#ff4d4d; --blue:#3d8bff; --pink:#ff7eb3; --green:#2fc28a; --purple:#9b6bff;
    --line:3px solid var(--ink); --shadow:5px 5px 0 var(--ink); --r:16px;
    --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  .logo,.hello h1,.label,.hero h2,.new,.play{font-weight:900;font-synthesis:none}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background-image:radial-gradient(rgba(29,27,34,.09) 1.3px,transparent 1.4px);
    background-size:18px 18px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;text-decoration:none}
  img{display:block;width:100%;height:auto}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}

  /* ---------- ヘッダー ---------- */
  .top{background:var(--yellow);border-bottom:var(--line)}
  .top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
  .logo{font-family:var(--display);font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .logo .mark{width:34px;height:34px;border:var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px}
  .top .count{margin-left:auto;font-size:13px;font-weight:800;background:#fff;border:var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}

  .hello{padding:30px 0 6px;text-align:center}
  .hello h1{font-family:var(--display);font-size:clamp(28px,7.6vw,52px);line-height:1.25;letter-spacing:.02em}
  .hello h1 .hl{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .1em}
  .hello p{margin-top:10px;color:var(--sub);font-size:14px;font-weight:700}

  /* ---------- 見出し ---------- */
  .label{display:inline-block;font-family:var(--display);font-size:15px;background:var(--ink);color:#fff;
    padding:5px 14px 6px;border-radius:999px;margin:28px 0 12px;letter-spacing:.04em}

  /* ---------- 最新作 ---------- */
  .hero{display:grid;grid-template-columns:1.35fr 1fr;background:var(--card);border:var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,box-shadow .12s}
  .hero .pic{position:relative;border-right:var(--line);background:#000}
  .hero .pic img{height:100%;object-fit:cover;aspect-ratio:1200/630}
  .hero .info{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px}
  .hero h2{font-family:var(--display);font-size:clamp(24px,4vw,34px);line-height:1.2}
  .hero .catch{font-weight:900;font-size:17px;color:var(--red)}
  .hero .desc{font-size:14.5px;line-height:1.75;color:#3c3844}
  .hero .play{margin-top:auto;align-self:flex-start;font-size:18px;padding:12px 28px}
  .new{position:absolute;top:12px;right:12px;font-family:var(--display);font-size:14px;background:var(--red);color:#fff;
    border:var(--line);border-radius:8px;padding:3px 10px 4px;transform:rotate(6deg);box-shadow:3px 3px 0 var(--ink)}

  /* ---------- 絞り込み ---------- */
  .tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
  .chip{font:inherit;font-size:14px;font-weight:800;color:var(--ink);background:#fff;border:var(--line);border-radius:999px;
    padding:7px 14px;min-height:40px;cursor:pointer;transition:transform .08s}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff}
  .chip:active{transform:scale(.95)}
  .gacha{margin-left:auto;background:var(--pink)}

  /* ---------- 一覧 ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{display:flex;flex-direction:column;background:var(--card);border:var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,box-shadow .12s}
  .card .pic{border-bottom:var(--line);background:#000;position:relative}
  .card .pic img{aspect-ratio:1200/630;object-fit:cover}
  .card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h3{font-size:17px;font-weight:900;line-height:1.35}
  .card .catch{font-size:13.5px;font-weight:800;color:var(--red)}
  .card .desc{font-size:13.5px;line-height:1.65;color:#4a4552}
  .card .foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  @media (hover:hover){
    .card:hover,.hero:hover{transform:translate(-2px,-3px) rotate(-.4deg);box-shadow:8px 9px 0 var(--ink)}
  }
  .card:active,.hero:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}

  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11.5px;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;background:#fff}
  .tag.t3D{background:#d9e8ff}.tag.t2D{background:#ffe1ee}.tag.t対戦{background:#ffd9d9}
  .tag.tランキング{background:#fff0a8}.tag.tリズム{background:#e8dcff}
  .play{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:14px;background:var(--yellow);
    border:var(--line);border-radius:999px;padding:5px 14px 6px;white-space:nowrap}
  .card.flash{animation:flash .9s ease 2}
  @keyframes flash{50%{box-shadow:0 0 0 6px var(--pink),var(--shadow)}}

  /* ---------- フッター ---------- */
  footer{text-align:center;color:var(--sub);font-size:12px;padding:48px 16px 40px}

  /* ---------- スマホ ---------- */
  @media (max-width:860px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:700px){
    .hero{grid-template-columns:1fr}
    .hero .pic{border-right:0;border-bottom:var(--line)}
    .hero .info{padding:16px 16px 18px}
    .hero .play{align-self:stretch;justify-content:center}
  }
  @media (max-width:560px){
    .grid{gap:14px}
    :root{--shadow:4px 4px 0 var(--ink);--r:13px}
    .card .body{padding:9px 10px 11px;gap:5px}
    .card h3{font-size:14.5px}
    .card .catch{font-size:12px}
    .card .desc{display:none}
    .card .foot{flex-direction:column;align-items:stretch}
    .card .play{justify-content:center;font-size:13px}
    .tag{font-size:10.5px;padding:0 5px}
    .gacha{margin-left:0}
    .hello p{word-break:keep-all}
        .tools{gap:6px}
    .chip{font-size:13px;padding:6px 11px;min-height:38px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="./"><span class="mark">⛄</span>キャップ雪だるま</a>
    <span class="count" id="count"></span>
  </div>
</header>

<main class="wrap">
  <section class="hello">
    <h1>タップして<span class="hl">すぐ遊べる</span><br>単発ゲーム置き場</h1>
    <p>インストール不要。スマホのブラウザで<wbr>そのまま遊べます</p>
  </section>

  <span class="label">🔥 最新作</span>
  <a class="hero" id="hero"></a>

  <span class="label">🎮 ぜんぶのゲーム</span>
  <div class="tools" id="tools"></div>
  <div class="grid" id="grid"></div>

</main>

<footer>© キャップ雪だるま</footer>

<script>
/* =========================================================
   ゲームを追加するときは、この配列のいちばん上に1つ足すだけ。
   先頭のゲームが「最新作」として大きく表示されます。
   tags: 3D / 2D / リズム / 対戦 / ランキング（自由に追加OK）
   ========================================================= */
const GAMES = [
  {
    title: "空飛ぶ車の駐車場",
    url: "./games/skypark/", img: "./games/skypark/ogp.png",
    catch: "かっこよく停めろ！",
    desc: "ジェットを噴かして空飛ぶ車を駐車。横風・鳥・雷・ドローン・UFOが邪魔してくる全8ステージ。",
    tags: ["2D"],
  },
  {
    title: "角刈り一丁ッ！",
    url: "./games/kakugari/", img: "./games/kakugari/ogp.png",
    catch: "90度ジャストに刈り上げろ！",
    desc: "指でスライドして刈り、退店時は角刈りの型抜き。はみ出したら転び、スカスカなら店長がボコられる。",
    tags: ["3D"],
  },
  {
    title: "激落！！消しゴムバトル！！",
    url: "./gekiochi/", img: "./gekiochi/ogp.png",
    catch: "弾いて机から叩き落とせ！",
    desc: "消しゴムを指で弾く3D対戦。CPU戦・友達とネット対戦・ランクマッチ。",
    tags: ["3D", "対戦", "ランキング"],
  },
  {
    title: "本日のマナー講座ザマス",
    url: "./games/zamasu/", img: "./games/zamasu/ogp.png",
    catch: "怒られずに食べきれるか!?",
    desc: "マナー講師の目を盗んで完食せよ。和洋中 全12編。ムカついたらちゃぶ台返し💥",
    tags: ["3D"],
  },
  {
    title: "ブタもおだてりゃ木に登る",
    url: "./games/butaki/", img: "./games/butaki/ogp.png",
    catch: "どこまで登れるブー？",
    desc: "木こりをよけて、おだてられながらブタが木を登り続ける。←→かタップで操作。",
    tags: ["2D"],
  },
  {
    title: "かもしれない運転",
    url: "./games/kamoshirenai/", img: "./games/kamoshirenai/ogp.png",
    catch: "「かもしれない」をよけ続けろ",
    desc: "迫りくる「かもしれない」をよけて、何m生き残れるか。最高320km/h。",
    tags: ["2D", "ランキング"],
  },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tagsHTML = g => `<div class="tags">${g.tags.map(t => `<span class="tag t${esc(t)}">${esc(t)}</span>`).join("")}</div>`;

// 最新作
const h = GAMES[0], hero = document.getElementById("hero");
hero.href = h.url;
hero.innerHTML = `
  <div class="pic"><img src="${esc(h.img)}" alt="${esc(h.title)}" fetchpriority="high"><span class="new">NEW!</span></div>
  <div class="info">
    ${tagsHTML(h)}
    <h2>${esc(h.title)}</h2>
    <div class="catch">${esc(h.catch)}</div>
    <p class="desc">${esc(h.desc)}</p>
    <span class="play">▶ 今すぐ遊ぶ</span>
  </div>`;

document.getElementById("count").textContent = `全${GAMES.length}本`;

// 一覧
const grid = document.getElementById("grid");
grid.innerHTML = GAMES.map((g, i) => `
  <a class="card" href="${esc(g.url)}" data-tags="${esc(g.tags.join(","))}" data-i="${i}">
    <div class="pic"><img src="${esc(g.img)}" alt="${esc(g.title)}" loading="lazy"></div>
    <div class="body">
      ${tagsHTML(g)}
      <h3>${esc(g.title)}</h3>
      <div class="catch">${esc(g.catch)}</div>
      <p class="desc">${esc(g.desc)}</p>
      <div class="foot"><span class="play">▶ 遊ぶ</span></div>
    </div>
  </a>`).join("");

// 絞り込み（タグはゲームから自動で集める）
const order = ["3D", "2D", "リズム", "対戦", "ランキング"];
const allTags = [...new Set(GAMES.flatMap(g => g.tags))]
  .sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
const tools = document.getElementById("tools");
tools.innerHTML = ["すべて", ...allTags].map((t, i) =>
  `<button class="chip" data-tag="${esc(t)}" aria-pressed="${i === 0}">${esc(t)}</button>`).join("")
  + `<button class="chip gacha" id="gacha">🎲 迷ったらガチャ</button>`;

tools.addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  if (b.id === "gacha") return gacha();
  tools.querySelectorAll(".chip[data-tag]").forEach(c => c.setAttribute("aria-pressed", c === b));
  const t = b.dataset.tag;
  grid.querySelectorAll(".card").forEach(c => {
    c.hidden = !(t === "すべて" || c.dataset.tags.split(",").includes(t));
  });
});

// ランダムで1本光らせる
function gacha() {
  const cards = [...grid.querySelectorAll(".card:not([hidden])")];
  if (!cards.length) return;
  const c = cards[Math.floor(Math.random() * cards.length)];
  cards.forEach(x => x.classList.remove("flash"));
  c.scrollIntoView({ behavior: "smooth", block: "center" });
  void c.offsetWidth; c.classList.add("flash");
}
</script>
</body>
</html>
